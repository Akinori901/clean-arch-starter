# 層の規約検証。
#
# ここが落ちたらデプロイへ進まない（deploy.yml が needs で待つ）。
# 規約を文章で配るだけでは守られないため、CI で落ちる形にしてある。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml から needs で呼ぶために必要。
  # これが無いと "workflow was not found" で落ちる。
  workflow_call:

permissions:
  contents: read

jobs:
  django:
    name: Django (DDD 層検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/django-ddd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/django-ddd/requirements-dev.txt

      - name: 依存インストール
        run: pip install -r requirements-dev.txt

      # ── ここが本丸 ──
      # 「domain が Django を import していないか」は型検査では落ちない。
      # 層の依存方向を見る専用のツールが要る。
      - name: 層の依存方向を検証（import-linter）
        run: lint-imports --config .importlinter
        env:
          # import-linter は PYTHONPATH で層のパッケージを解決する
          PYTHONPATH: src

      - name: 静的解析（ruff）
        run: ruff check src tests

      - name: 型検査（mypy）
        run: mypy src

      - name: テスト
        run: pytest tests
        env:
          PYTHONPATH: src

  laravel:
    name: Laravel (クリーンアーキ層検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/laravel-clean
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, intl, bcmath
          coverage: none

      - name: 依存インストール
        run: composer install --no-interaction --prefer-dist

      # PHPStan は型を見るが、層の依存方向は見ない。
      # 「Service から Model を直接呼んでいないか」は deptrac の仕事。
      # --fail-on-uncovered は付けない。Laravel 本体のクラス（Model の基底等）が
      # uncovered として数えられ、層違反ゼロでも落ちてしまうため。
      # 見たいのは「宣言した層の間の依存方向」であって網羅率ではない。
      - name: 層の依存方向を検証（deptrac）
        run: ./vendor/bin/deptrac analyse --config-file=depfile.yaml

      - name: 静的解析（PHPStan）
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: テスト
        run: ./vendor/bin/phpunit --testsuite Unit

  go:
    name: Go (クリーンアーキ層検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-clean
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: services/go-clean/go.sum

      # golangci-lint も go vet も「層の依存方向」は見ない。
      # 「entity が DB ドライバを import していないか」は専用ツールが要る。
      - name: 層の依存方向を検証（go-arch-lint）
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          "$(go env GOPATH)/bin/go-arch-lint" check

      - name: 静的解析（golangci-lint）
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: services/go-clean

      - name: フォーマット確認
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test ./... -count=1

  hanami:
    name: Hanami (クリーンアーキ層検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hanami-clean
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: services/hanami-clean

      # RuboCop は「層の依存方向」を見られないため専用スクリプトで検証する。
      - name: 層の依存方向を検証
        run: ruby bin/verify-layers

      - name: 静的解析（RuboCop）
        run: bundle exec rubocop

      - name: テスト（ドメイン層は Hanami を起動せずに動く）
        run: bundle exec rspec spec/domain -I lib -I spec

  dotnet:
    name: .NET (クリーンアーキ層検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dotnet-clean
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ── ここが本丸（1段目）──
      # C# は ProjectReference が依存方向を強制する。
      # Domain に Infrastructure への参照を足すと、
      # 循環参照としてビルドがコンパイルエラーで落ちる。
      - name: 層の依存方向を検証（ProjectReference / ビルド）
        run: dotnet build --configuration Release

      # ── ここが本丸（2段目）──
      # ProjectReference は「他プロジェクトへの依存」しか縛らないため、
      # NuGet パッケージ経由の層破壊（Domain に EF Core を入れる等）は素通りする。
      # それを NetArchTest で落とす。
      - name: 層の依存方向を検証（NetArchTest）+ テスト
        run: dotnet test --configuration Release --no-build

  frontend:
    name: Frontend (境界検証)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend-react/package-lock.json

      - run: npm ci

      # feature 間の相互参照・shared→feature の逆流を検知する
      - name: 境界検証（eslint-plugin-boundaries）
        run: npm run lint

      - name: 型検査
        run: npm run typecheck

      - name: ビルド（S3 へ置く成果物が作れるか）
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_COGNITO_AUTHORITY: https://example.invalid
          VITE_COGNITO_CLIENT_ID: dummy
          VITE_COGNITO_REDIRECT_URI: https://example.invalid

  infra:
    name: IaC 検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - name: SAM テンプレート検証
        run: cfn-lint infra/sam/template.yaml
