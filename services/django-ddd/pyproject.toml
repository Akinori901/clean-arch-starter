[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"
# マイグレーションは Django が自動生成するため、整形の対象外にする。
# 手で直しても makemigrations で元に戻る。
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# 層をまたぐ相対 import を禁止する。
# `from ...domain import` のような書き方は層の境界を曖昧にする。
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# src/ を検査対象に渡すと "src.domain..." と "domain..." の
# 両方で解決してしまい "found twice under different module names" になる。
# mypy_path で src/ を起点にしてあるので、明示的に無効化する。
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
# domain/application は外部ライブラリに依存しないため、より厳しくできる
[[tool.mypy.overrides]]
module = ["domain.*", "application.*"]
disallow_any_explicit = true

# boto3 / botocore は py.typed を持たないため、型情報が無い前提で扱う。
# 実際の型は infrastructure 層の中に閉じており、domain/application へは漏れない。
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "mangum.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
